<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="500" rx="14" fill="#fcfcfb" stroke="#e4e3df"/>
  <text x="28" y="42" font-size="19" font-weight="700" fill="#0b0b0b">One orchestrator, two pools of cheaper workers</text>
  <text x="28" y="64" font-size="13" fill="#52514e">The big model plans, delegates, and synthesizes. Workers loop to completion; only summaries return.</text>

  <!-- Orchestrator -->
  <rect x="40" y="200" width="200" height="110" rx="10" fill="#2a78d6"/>
  <text x="140" y="243" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">Orchestrator</text>
  <text x="140" y="265" font-size="13" fill="#ffffff" text-anchor="middle" font-style="italic">Fable 5 / Opus</text>
  <text x="140" y="286" font-size="12" fill="#dce9fa" text-anchor="middle">plan · judge · synthesize</text>
  <!-- main loop -->
  <path d="M 70 200 C 30 160, 110 150, 105 196" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#arrGray)"/>
  <text x="30" y="150" font-size="11" fill="#52514e" font-style="italic">main loop</text>

  <!-- Pool 1: Anthropic subagents -->
  <rect x="470" y="95" width="400" height="150" rx="10" fill="none" stroke="#b9b8b2" stroke-dasharray="5 4"/>
  <text x="486" y="120" font-size="13" font-weight="700" fill="#0b0b0b">Anthropic subagents</text>
  <text x="486" y="137" font-size="11.5" fill="#52514e">model + effort pinned in frontmatter (claude-agents/)</text>
  <g font-size="12">
    <rect x="486" y="150" width="116" height="72" rx="8" fill="#ffffff" stroke="#b9b8b2"/>
    <text x="544" y="178" text-anchor="middle" font-weight="600" fill="#0b0b0b">researcher</text>
    <text x="544" y="196" text-anchor="middle" fill="#52514e" font-style="italic">Sonnet 5 · med</text>
    <rect x="612" y="150" width="116" height="72" rx="8" fill="#ffffff" stroke="#b9b8b2"/>
    <text x="670" y="178" text-anchor="middle" font-weight="600" fill="#0b0b0b">verifier</text>
    <text x="670" y="196" text-anchor="middle" fill="#52514e" font-style="italic">Sonnet 5 · high</text>
    <rect x="738" y="150" width="116" height="72" rx="8" fill="#ffffff" stroke="#b9b8b2"/>
    <text x="796" y="178" text-anchor="middle" font-weight="600" fill="#0b0b0b">pr-preparer</text>
    <text x="796" y="196" text-anchor="middle" fill="#52514e" font-style="italic">Haiku · med</text>
  </g>
  <!-- worker self-loops -->
  <path d="M 590 150 C 600 132, 616 132, 610 148" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrGray)"/>
  <path d="M 716 150 C 726 132, 742 132, 736 148" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrGray)"/>
  <path d="M 842 150 C 852 132, 868 132, 862 148" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrGray)"/>

  <!-- Pool 2: Codex -->
  <rect x="470" y="275" width="400" height="180" rx="10" fill="none" stroke="#b9b8b2" stroke-dasharray="5 4"/>
  <text x="486" y="300" font-size="13" font-weight="700" fill="#0b0b0b">GPT-5.6 via Codex CLI (ChatGPT subscription)</text>
  <text x="486" y="317" font-size="11.5" fill="#52514e">codex-run.sh pins model + effort + sandbox per task class</text>
  <g font-size="12">
    <rect x="486" y="330" width="176" height="72" rx="8" fill="#ffffff" stroke="#b9b8b2"/>
    <text x="574" y="356" text-anchor="middle" font-weight="600" fill="#0b0b0b">review / explore</text>
    <text x="574" y="374" text-anchor="middle" fill="#52514e" font-style="italic">gpt-5.6-sol · med</text>
    <rect x="678" y="330" width="176" height="72" rx="8" fill="#ffffff" stroke="#b9b8b2"/>
    <text x="766" y="356" text-anchor="middle" font-weight="600" fill="#0b0b0b">commit / implement</text>
    <text x="766" y="374" text-anchor="middle" fill="#52514e" font-style="italic">gpt-5.6-luna · med/xhigh</text>
  </g>
  <!-- codex internal fan-out -->
  <path d="M 574 402 C 574 424, 640 424, 700 412" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#arrGray)"/>
  <text x="500" y="437" font-size="11" fill="#52514e" font-style="italic">a sol orchestrator can fan out to its own luna leaves</text>

  <!-- fan-out arrows -->
  <path d="M 240 230 C 340 190, 380 180, 462 172" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrBlue)"/>
  <path d="M 240 280 C 340 320, 380 340, 462 362" fill="none" stroke="#2a78d6" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="318" y="215" font-size="12" fill="#2a78d6" font-style="italic">fan out</text>
  <!-- return arrows -->
  <path d="M 462 200 C 380 226, 330 240, 248 252" fill="none" stroke="#52514e" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrGray)"/>
  <path d="M 462 390 C 370 388, 300 330, 244 300" fill="none" stroke="#52514e" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arrGray)"/>
  <text x="300" y="262" font-size="11" fill="#52514e" font-style="italic">summaries only</text>

  <defs>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#2a78d6"/></marker>
    <marker id="arrGray" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 z" fill="#52514e"/></marker>
  </defs>
</svg>
